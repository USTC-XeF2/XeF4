[project]
name = "XeF4"
version = "1.0.0"
description = "A multifunctional QQ robot"
readme = "README.md"
requires-python = ">=3.10, <4.0"
dependencies = [
    "beautifulsoup4>=4.14",
    "ddgs>=9.14",
    "img2pdf>=0.6",
    "jmcomic>=2.6",
    "langchain~=0.3",
    "langchain-community~=0.3",
    "langchain-openai~=0.3",
    "matplotlib>=3.10",
    "mcstatus>=13.1",
    "nonebot-adapter-minecraft>=1.8",
    "nonebot-adapter-onebot>=2.4",
    "nonebot-plugin-alconna>=0.62",
    "nonebot-plugin-apscheduler>=0.5",
    "nonebot-plugin-localstore>=0.7",
    "nonebot-plugin-session-config>=1.0",
    "nonebot2[fastapi,websockets]>=2.5",
]

[dependency-groups]
dev = [
    "ruff~=0.15",
]

[tool.nonebot]
plugin_dirs = ["src/plugins"]
builtin_plugins = []

[tool.nonebot.plugins]
"@local" = []

[tool.nonebot.adapters]
"@local" = []
nonebot-adapter-onebot = [{name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11"}]
nonebot-adapter-minecraft = [{name = "Minecraft", module_name = "nonebot.adapters.minecraft"}]

[tool.ruff.lint]
ignore = ["E402"]
